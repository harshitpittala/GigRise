# Netlify site config for @gigrise/web — DECISIONS.md ADR-019 / PROJECT_SETUP.md §10.1.
# Netlify's monorepo build runs `build.command` from the REPO ROOT
# regardless of the "Base directory"/packagePath setting (confirmed via
# apps/admin's deploy log: "Current directory: /opt/build/repo") — paths
# below are written relative to root, not to apps/web. Do not add a `cd`.
[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter=@gigrise/web build"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
