# Netlify site config for @gigrise/admin — DECISIONS.md ADR-019 / PROJECT_SETUP.md §10.1.
# Netlify's monorepo build runs `build.command` from the REPO ROOT
# regardless of the "Base directory"/packagePath setting (confirmed via
# deploy log: "Current directory: /opt/build/repo") — paths below are
# written relative to root, not to apps/admin. Do not add a `cd` here.
[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter=@gigrise/admin build"
  publish = "apps/admin/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
